design:
  minimum_event_week: -16
  maximum_event_week: 16
  minimum_clean_pre_weeks: 8
  minimum_donors_per_required_week: 1
  donor_rule: market-active-and-not-yet-anticipated-or-treated
  treatment_clock: governance-controlled-market-activation
  causal_estimates_allowed: false

events:
