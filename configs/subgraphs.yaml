schema_version: 2
source:
  provider: the_graph
  owner: aave
  repository: https://github.com/aave/protocol-subgraphs
  authority: future_independent_validation_only
  completed: false
  latest_gateway_template: https://gateway.thegraph.com/api/{api_key}/subgraphs/id/{subgraph_id}
  pinned_deployment_gateway_template: https://gateway.thegraph.com/api/{api_key}/deployments/id/{deployment_id}
  last_reviewed: "2026-08-11"
  notes: >-
    Raw consensus RPC logs are authoritative for every reported event, policy clock, and
    outcome. Official Aave Subgraphs are a pre-specified future reconciliation layer.
    The advertised subgraph IDs below may resolve to mutable latest deployments; they do
    not become pinned evidence until deployment_id, repository commit, mapping hashes,
    schema hash, indexed-block gate, query hash, and response hash are recorded.

validation_protocol:
  completed: false
  required_before_execution:
    - repository_commit
    - schema_sha256
    - mapping_sha256
    - deployment_id
    - indexed_block_at_or_beyond_requested_end
    - no_indexing_error
  canonical_join_key:
    - chain_id
    - block_number
    - transaction_hash
    - log_index
  compared_fields:
    - event_name
    - pool_emitter
    - reserve_address
    - action_side_address
    - position_holder_address
    - raw_integer_amount
  outputs:
    - unmatched_event_keys
    - field_level_differences
    - weekly_action_count_differences
    - weekly_position_holder_metric_differences
    - retrieval_manifest

