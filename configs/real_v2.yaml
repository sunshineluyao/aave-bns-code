schema_version: 1
status: preregistration-lock-draft
source_event_ledger: data/metadata/event_source_audit.csv

analysis:
  observation_unit: chain-market-action-layer-event-week
  timezone: UTC
  window:
    pre_weeks: 16
    post_weeks: 16
    include_event_week: true
  treatment_clock:
    primary: governance-controlled market activation block
    anticipation: official forum or ARFC publication
    readiness_covariate: technical deployment or CCIP configuration
    implementation_check: first verified user action
  action_layers:
    - supply
    - withdraw
    - borrow
    - repay
    - liquidation
    - transfer
    - bridge
  primary_outcomes:
    participation: effective_active_entities
    concentration: adjusted_activity_hhi
    structure: core_activity_share
    infrastructure: bridge_route_concentration
  estimators:
    ethereum: saturated-triple-difference-or-synthetic-control-after-pre-fit-gate
    cross_chain: group-time-did-with-not-yet-treated-controls
  safeguards:
    - no invented GHO pre-period
    - no first-user transaction as treatment
    - no post-treatment entity labels in baseline controls
    - no causal estimate before source-label-treatment-and-analysis locks pass

